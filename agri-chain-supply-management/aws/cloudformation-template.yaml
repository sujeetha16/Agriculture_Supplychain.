AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Agriculture Supply Chain Platform - Production Cloud Infrastructure
  Provisions Amazon S3 (Private Static Web App Bucket), Amazon CloudFront (Edge CDN with OAC),
  AWS App Runner (Containerized API with CORS allowlist), Amazon CloudWatch (Observability & Alarms),
  Amazon SNS (Operational Alerting), and AWS IAM Least-Privilege Execution Roles.

Parameters:
  ProjectName:
    Type: String
    Default: agriculture-supply-chain
    Description: Prefix identifier for platform resources
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Target deployment tier
  BackendImageIdentifier:
    Type: String
    Description: >
      Required private Amazon ECR image URI for the containerized Express API
      (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/agri-chain-backend:latest).
      Must NOT use public ECR (public.ecr.aws/...) or hello-app-runner sample images,
      as this service is configured with private ECR authentication (ImageRepositoryType: ECR).
    AllowedPattern: '^\d{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\/[a-z0-9._\/-]+:[a-zA-Z0-9._-]+$'
    ConstraintDescription: >
      Must be a valid private Amazon ECR image URI including 12-digit account ID, region, repository, and tag
      (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/agri-chain-backend:latest).
  JwtSecretArn:
    Type: String
    Description: >
      AWS Secrets Manager Secret ARN containing the production JWT signing key (minimum 32 characters).
      Injected securely into App Runner via RuntimeEnvironmentSecrets without exposing secret text in templates.
  DatabaseSecretArn:
    Type: String
    Description: >
      AWS Secrets Manager Secret ARN containing the production MongoDB Atlas or DocumentDB connection URI.
      Injected securely into App Runner via RuntimeEnvironmentSecrets without exposing credentials in templates.
  KmsKeyArn:
    Type: String
    Default: ""
    Description: >
      Optional AWS KMS Key ARN used to encrypt the Secrets Manager secrets (required only if using a Customer-Managed KMS Key).
      Leave blank if secrets use the default AWS-managed key (aws/secretsmanager).
  ContractAddress:
    Type: String
    Default: "0xB601FDccec475b61B8Bc9f3661eC4F73B7499a2D"
    Description: >
      Deployed AgriChain smart contract address on Ethereum Sepolia.
    AllowedPattern: '^0x[a-fA-F0-9]{40}$'
    ConstraintDescription: Must be a valid 42-character Ethereum hex address starting with 0x.
  SepoliaRpcSecretArn:
    Type: String
    Default: ""
    Description: >
      Optional AWS Secrets Manager Secret ARN containing the Ethereum Sepolia JSON-RPC URL (recommended if the endpoint includes a secret API key).
      Injected into App Runner as SEPOLIA_RPC_URL. If blank, the service uses built-in public Sepolia gateways.
  SepoliaRpcUrl:
    Type: String
    Default: ""
    Description: >
      Optional public or non-sensitive Ethereum Sepolia JSON-RPC URL. Used only if SepoliaRpcSecretArn is blank.
      If both are blank, the backend falls back to its resilient built-in public Sepolia RPC gateway list.
  FrontendAllowedOrigins:
    Type: String
    Default: ""
    Description: >
      Optional comma-separated list of authorized web origins for CORS (e.g. https://d12345678abcdef.cloudfront.net).
      Leave blank to automatically authorize the CloudFront distribution domain created by this template.
  AlarmNotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address to receive CloudWatch 5xx alarm notifications via Amazon SNS.
Conditions:
  HasCustomAllowedOrigins: !Not [!Equals [!Ref FrontendAllowedOrigins, ""]]
  HasNotificationEmail: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]
  HasCustomKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasSepoliaRpcSecret: !Not [!Equals [!Ref SepoliaRpcSecretArn, ""]]
  HasCustomRpcUrl: !Not [!Equals [!Ref SepoliaRpcUrl, ""]]

Resources:
  # 1. Private S3 Storage Bucket for SPA Frontend Artifacts
  FrontendS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # 2. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. IAM Role for App Runner Instance Execution & Secrets Manager Access
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-apprunner-instance-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Least-privilege Secrets Manager access for runtime secret injection
        - PolicyName: AppRunnerSecretsManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !If
                  - HasSepoliaRpcSecret
                  - - !Ref JwtSecretArn
                    - !Ref DatabaseSecretArn
                    - !Ref SepoliaRpcSecretArn
                  - - !Ref JwtSecretArn
                    - !Ref DatabaseSecretArn

  # 4. Conditional IAM Policy for Customer-Managed KMS Key (CMK) Decryption
  AppRunnerKmsDecryptPolicy:
    Type: AWS::IAM::Policy
    Condition: HasCustomKmsKey
    Properties:
      PolicyName: AppRunnerKmsDecryptPolicy
      Roles:
        - !Ref AppRunnerInstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource: !Ref KmsKeyArn

  # 5. IAM Role for App Runner ECR Access (Private ECR Pull)
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-apprunner-ecr-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # 6. CloudFront Global Edge Distribution (Distributes Frontend SPA from S3 via OAC)
  # Architecture Note: CloudFront serves the static Vite frontend from private S3.
  # The frontend makes direct API calls to App Runner via VITE_API_URL, secured by CORS.
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} CDN Edge Distribution (${Environment})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # Cost-effective: US & Europe edge POPs
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendS3Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        # Single Page Application (SPA) Client-Side Route Fallback
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # 7. S3 Bucket Policy Enforcing Private Access via CloudFront Service Principal
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendS3Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}"

  # 8. AWS App Runner Service (Containerized Express API Backend)
  BackendAppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-api-${Environment}"
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref BackendImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "5000"
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: production
              - Name: PORT
                Value: "5000"
              - Name: ALLOWED_ORIGINS
                Value: !If
                  - HasCustomAllowedOrigins
                  - !Ref FrontendAllowedOrigins
                  - !Sub "https://${CloudFrontDistribution.DomainName}"
              - Name: CONTRACT_ADDRESS
                Value: !Ref ContractAddress
              - Name: SEPOLIA_PUBLIC_RPC_URL
                Value: !If
                  - HasCustomRpcUrl
                  - !Ref SepoliaRpcUrl
                  - ""
            RuntimeEnvironmentSecrets:
              - Name: JWT_SECRET
                Value: !Ref JwtSecretArn
              - Name: MONGODB_URI
                Value: !Ref DatabaseSecretArn
              - !If
                - HasSepoliaRpcSecret
                - Name: SEPOLIA_RPC_URL
                  Value: !Ref SepoliaRpcSecretArn
                - !Ref "AWS::NoValue"
      InstanceConfiguration:
        Cpu: "1024" # 1 vCPU
        Memory: "2048" # 2 GB RAM
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # 8. Amazon SNS Topic for Operational Alarms (Optional, provisioned when email is provided)
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub "${ProjectName}-operational-alarms-${Environment}"
      Subscription:
        - Endpoint: !Ref AlarmNotificationEmail
          Protocol: email


  Backend5xxErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: BackendAppRunnerService
    Properties:
      AlarmName: !Sub "${ProjectName}-backend-5xx-alarm-${Environment}"
      AlarmDescription: Triggers when the App Runner backend experiences elevated HTTP 5xx error rates.
      MetricName: 5xxStatusResponses
      Namespace: AWS/AppRunner
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ServiceID
          Value: !GetAtt BackendAppRunnerService.ServiceId
        - Name: ServiceName
          Value: !Sub "${ProjectName}-api-${Environment}"
      TreatMissingData: notBreaching
      AlarmActions: !If [HasNotificationEmail, [!Ref AlarmNotificationTopic], !Ref "AWS::NoValue"]

Outputs:
  CloudFrontDistributionURL:
    Description: Global HTTPS Edge URL for the Agriculture Supply Chain web application
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  BackendServiceURL:
    Description: Production HTTPS URL for the containerized AWS App Runner API
    Value: !Sub "https://${BackendAppRunnerService.ServiceUrl}"

  FrontendS3BucketName:
    Description: Private S3 Bucket housing production Vite static artifacts
    Value: !Ref FrontendS3Bucket

  CloudFrontDistributionId:
    Description: CloudFront Distribution Identifier for invalidation triggers
    Value: !Ref CloudFrontDistribution
